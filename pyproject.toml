[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "timeseries-zarr"
dynamic = ["version"]
description = "Reads and writes TS-Zarr bundles of neurophysiology time series"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Rohan Shah" }]
keywords = [
    "zarr",
    "time series",
    "neurophysiology",
    "electrophysiology",
    "downsampling",
    "pyramid",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "zarr>=3.2.1,<4",
    "numpy>=2",
    "numcodecs>=0.16",
    "google-crc32c>=1.5",
]

[project.urls]
Source = "https://github.com/Pennsieve/timeseries-zarr-py"
Issues = "https://github.com/Pennsieve/timeseries-zarr-py/issues"
Specification = "https://github.com/Pennsieve/timeseries-zarr-py/blob/main/docs/spec.md"
Changelog = "https://github.com/Pennsieve/timeseries-zarr-py/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
dev = [
    "mypy>=1.8.0",
    "ruff==0.17.0",
    "pre-commit",
]
pandas = [
    "pandas>=2.2.2",
]
xarray = [
    "xarray>=2024.6.0",
    "pandas>=2.2.2",
]
remote = [
    "fsspec>=2024.12.0",
    "s3fs>=2024.12.0",
    "aiohttp>=3.9",
]

[tool.setuptools.packages.find]
include = ["timeseries_zarr*"]

[tool.setuptools.package-data]
timeseries_zarr = ["py.typed"]

[tool.setuptools_scm]
version_file = "timeseries_zarr/_version.py"

[tool.coverage.run]
source = ["timeseries_zarr"]
omit = [
    "timeseries_zarr/__init__.py",
    "timeseries_zarr/_version.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.\\s*$",
]

[tool.ruff]
target-version = "py312"
line-length = 80
extend-exclude = ["timeseries_zarr/_version.py"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade (modern syntax)
    "ANN",  # flake8-annotations (require type annotations)
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "TID",  # flake8-tidy-imports
    "N",    # pep8-naming
    "PL",   # pylint
    "D",    # pydocstyle (Google docstring conventions)
    "DOC102",  # documented parameter does not exist
    "DOC202",  # Returns section on a function that returns nothing
    "DOC402",  # missing Yields section
    "DOC403",  # Yields section on a function that does not yield
]
ignore = [
    "E501",     # line too long (handled by formatter)
    "B008",     # do not perform function calls in argument defaults
    "PLR0913",  # too many arguments (writer functions legitimately take several)
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "C4", "ANN", "D", "DOC", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
files = ["timeseries_zarr", "scripts"]

[[tool.mypy.overrides]]
module = "timeseries_zarr._version"
ignore_errors = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pandas",
    "pandas.*",
    "xarray",
    "xarray.*",
    "fsspec",
    "fsspec.*",
    "numcodecs",
    "numcodecs.*",
]
ignore_missing_imports = true
