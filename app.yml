# yaml-language-server: $schema=https://app.pennsieve.io/static/schemas/app-manifest.v1.json

schemaVersion: "1.0"
name: Timeseries Zarr Writer
description: >-
  Converts an NWB neurophysiology recording into a pyramid Zarr v3 viewer
  bundle: a static directory a browser reads over HTTP range requests to render
  any time window interactively.
applicationType: processor

categories:
  - Format Conversion
  - Visualization

tags:
  - nwb
  - zarr
  - timeseries
  - neurophysiology
  - electrophysiology
  - min-max-envelope

runtime:
  computeTypes:
    - standard
  gpu:
    enabled: false

resources:
  cpu: 2048
  memory: 8192

inputs:
  - name: recording
    dataType: file
    required: true
    description: >-
      One NWB file. The writer reads the single file matching *.nwb in
      INPUT_DIR and fails if that directory holds none or several.

  - name: annotations
    dataType: file
    required: false
    description: >-
      Any number of *.annotations.ndjson files in INPUT_DIR, each one an
      annotation source that becomes one event channel. Normally these arrive
      from a parallel extractor branch at the merge. Without them the bundle
      holds signal only.

outputs:
  - name: bundle
    dataType: directory
    description: >-
      One Zarr v3 bundle written into OUTPUT_DIR, named for the input file stem:
      session.nwb produces session.zarr. The directory appears in one atomic
      rename, so a reader never sees a partial bundle. Every annotation file
      that arrived becomes one event channel inside it.

  - name: properties
    dataType: file
    description: >-
      Output properties written into OUTPUT_DIR beside the bundle. Its
      root_path key is the top-level directory name of the bundle.

parameters:
  - name: ASSET_PROPERTIES_FILE
    label: Properties file name
    description: >-
      Name of the output properties file written into OUTPUT_DIR. The asset
      target reads it for the bundle's root_path and excludes it from the
      upload, so the two must agree on the name.
    type: string
    default: asset-properties.json
    required: false

  - name: ZARR_WRITER_ZSTD_LEVEL
    label: Zstd compression level
    description: >-
      Compression level applied to every array in the bundle. Higher levels
      write a smaller bundle and take longer. Integer values only.
    type: number
    default: 5
    min: 0
    max: 22
    required: false

  - name: ZARR_WRITER_MAX_LEVELS
    label: Maximum pyramid levels
    description: >-
      Upper bound on the number of level groups built above the raw samples.
      Each level is 4x coarser than the one below it. Raw is not a level, and
      7 is the ceiling: a level-8 bin would span 65536 samples, past what the
      u2 valid member can count. Integer values only.
    type: number
    default: 7
    min: 1
    max: 7
    required: false

  - name: ZARR_WRITER_MIN_BINS
    label: Minimum bins per level
    description: >-
      The pyramid stops when the next level would hold fewer complete bins than
      this. Integer values only.
    type: number
    default: 1024
    min: 1
    required: false

  - name: ZARR_WRITER_INNER_LEN
    label: Inner chunk length
    description: >-
      Length in samples of the inner Zarr chunk, the smallest unit a reader can
      fetch. Integer values only.
    type: number
    default: 8192
    min: 1
    required: false

  - name: ZARR_WRITER_TARGET_SHARD_BYTES
    label: Target shard size
    description: >-
      Target size in bytes of an outer shard, rounded down to a whole number of
      inner chunks. One shard is one HTTP object. Integer values only.
    type: number
    default: 16777216
    min: 1
    required: false