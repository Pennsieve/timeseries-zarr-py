# yaml-language-server: $schema=https://app.pennsieve.io/static/schemas/app-manifest.v1.json

schemaVersion: "1.0"
name: Timeseries Zarr Writer
description: >-
  Converts an NWB neurophysiology recording into a TS-Zarr 1.0 bundle: a static
  directory of Zarr v3 arrays that a browser reads over HTTP range requests to
  render any time window interactively. Each continuous channel holds its raw
  samples and a ladder of levels with per-bin minimum, maximum, mean, and count.
  Spikes, intervals, and annotations become event channels.
applicationType: processor

categories:
  - Format Conversion
  - Visualization

tags:
  - nwb
  - zarr
  - ts-zarr
  - timeseries
  - neurophysiology
  - electrophysiology
  - min-max-envelope

runtime:
  computeTypes:
    - standard
  gpu:
    enabled: false

resources:
  cpu: 2048
  memory: 8192

inputs:
  - name: recording
    dataType: file
    required: true
    description: >-
      One NWB file. The writer reads the single file matching *.nwb in
      INPUT_DIR and fails if that directory holds none or several.

outputs:
  - name: bundle
    dataType: directory
    description: >-
      One TS-Zarr 1.0 bundle written into OUTPUT_DIR, named for the input file
      stem: session.nwb produces session.zarr. Its recording.json holds the
      subject, session, and wall-clock start. The directory appears in one
      atomic rename, so a reader never sees a partial bundle.

  - name: properties
    dataType: file
    description: >-
      Output properties written into OUTPUT_DIR beside the bundle. Its
      root_path key is the top-level directory name of the bundle.

parameters:
  - name: ASSET_PROPERTIES_FILE
    label: Properties file name
    description: >-
      Name of the output properties file written into OUTPUT_DIR.
    type: string
    default: asset-properties.json

  - name: ZARR_WRITER_ZSTD_LEVEL
    label: Zstd compression level
    description: >-
      Compression level applied to every array in the bundle. Higher levels
      write a smaller bundle and take longer. Integer values only.
    type: number
    default: 5
    min: 0
    max: 22

  - name: ZARR_WRITER_MAX_LEVELS
    label: Maximum pyramid levels
    description: >-
      Upper bound on the number of levels built above the raw samples. Each
      level is 4x coarser than the one below it, and the raw samples are not a
      level. Integer values only.
    type: number
    default: 15
    min: 1
    max: 15

  - name: ZARR_WRITER_VAR
    label: Write variance
    description: >-
      1 adds the per-bin variance member to every level of every continuous
      channel and folds every level from the raw samples in one pass, which
      needs more memory. 0 omits it. Only 0 and 1 are accepted.
    type: number
    default: 0
    min: 0
    max: 1

  - name: ZARR_WRITER_MIN_BINS
    label: Minimum bins per level
    description: >-
      The pyramid stops when the next level would hold fewer complete bins than
      this. Integer values only.
    type: number
    default: 1024
    min: 1

  - name: ZARR_WRITER_INNER_LEN
    label: Inner chunk length
    description: >-
      Length in samples of the inner Zarr chunk, the smallest unit a reader can
      fetch. Integer values only.
    type: number
    default: 8192
    min: 1

  - name: ZARR_WRITER_TARGET_SHARD_BYTES
    label: Target shard size
    description: >-
      Target size in bytes of an outer shard, rounded down to a whole number of
      inner chunks. One shard is one HTTP object. Integer values only.
    type: number
    default: 16777216
    min: 1
