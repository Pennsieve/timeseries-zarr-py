name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[test,dev]"
      - name: Lint
        run: ruff check timeseries_zarr/ tests/
      - name: Format
        run: ruff format --check timeseries_zarr/ tests/
      - name: Type check
        run: mypy timeseries_zarr/
      - name: Test
        run: python -m pytest tests/
